fast:
  profile: ./file

spring:
  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fast?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: sm770524
  # 服务器配置（和datasource同级，修正缩进）
  server:
    port: 8080
    servlet:
      context-path: /
  # 日志配置（和datasource同级，修正缩进）
  logging:
    level:
      com.fast: debug
      org.springframework: warn

# MyBatis核心配置（如果只用原生MyBatis）
mybatis:
  # 精准匹配resources/mapper下所有子目录的*Mapper.xml
  mapper-locations: classpath:mapper/**/*Mapper.xml
  # 实体类包（必须是domain所在包）
  type-aliases-package: com.fast.system.domain
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# 关键：添加MyBatis-Plus配置（解决方言报错）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 配置MySQL方言，解决"未配置sql方言"报错
      db-type: mysql
      id-type: auto  # 主键自增策略（可选，根据你的表设计）